name: Android APK and Obtainium releases

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The upstream action's default includes obsolete SDK 'tools',
          # which sdkmanager no longer provides; install platform-tools only.
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run tests and assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Attach debug APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: video-wallpaper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Debug APKs are automatically signed by the Android SDK with a
      # temporary build-machine key. No repository secrets are needed.
      # IMPORTANT: the key changes on fresh GitHub-hosted runners, so these
      # are for installation/testing, NOT reliable in-place Obtainium updates.
      - name: Verify Android debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publish test APK for Obtainium
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3.1.${GITHUB_RUN_NUMBER}"
          APK="video-wallpaper-${TAG}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its original APK/signature"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Video Wallpaper $TAG (test APK)" \
              --notes "TEST BUILD (debug-signed). No signing secrets required. The signing key changes between fresh GitHub Actions runners. Obtainium can discover and download new versions, but Android will generally reject installation over the previous test version due to signature mismatch. Uninstall the prior fork test APK before installing a new one. This does not affect the separate F-Droid version."
          fi
