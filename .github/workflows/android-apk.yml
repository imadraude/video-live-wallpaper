name: Android APK and Obtainium releases

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run tests and assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Attach debug APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: video-wallpaper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Require signing secrets for publishing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_SIGNING_PASSWORD" ]]; then
            echo "::error::Set RELEASE_KEYSTORE_BASE64 and RELEASE_SIGNING_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restore release signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/video-wallpaper-release.p12"
          chmod 600 "$RUNNER_TEMP/video-wallpaper-release.p12"
          echo "CI_SIGNING_KEYSTORE=$RUNNER_TEMP/video-wallpaper-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CI_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signed APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Publish release for Obtainium
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3.1.${GITHUB_RUN_NUMBER}"
          APK="video-wallpaper-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Video Wallpaper $TAG" \
              --notes "Automated signed APK. Unlock: coalesced frame draws, cached video sizes and delayed pause for short visibility transitions. Install via Obtainium using this repository's GitHub releases."
          fi
