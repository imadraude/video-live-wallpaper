name: Android build and tagged releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The upstream action's default includes obsolete SDK 'tools',
          # which sdkmanager no longer provides; install platform-tools only.
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check Ukrainian and English translations
        run: python3 scripts/check_translations.py

      - name: Run tests and assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Attach debug APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: video-wallpaper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: |
          APP_VERSION="$(sed -n 's/^appVersion=//p' gradle.properties)"
          if [[ -z "$APP_VERSION" || "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Gradle appVersion=$APP_VERSION"
            exit 1
          fi

      - name: Verify signing secrets are configured
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_SIGNING_PASSWORD" ]]; then
            echo "::error::Both RELEASE_KEYSTORE_BASE64 and RELEASE_SIGNING_PASSWORD must be set as repository Actions secrets."
            exit 1
          fi

      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/video-wallpaper-release.p12"
          chmod 600 "$RUNNER_TEMP/video-wallpaper-release.p12"
          echo "CI_SIGNING_KEYSTORE=$RUNNER_TEMP/video-wallpaper-release.p12" >> "$GITHUB_ENV"

      - name: Build release APK with permanent signature
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          CI_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Publish signed APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          APK="video-wallpaper-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace published APK"
            exit 1
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "Video Wallpaper $TAG" \
            --notes "Video Wallpaper update. Includes MediaPlayer and Media3 playback engines, Efficient and Compatible rendering, and Ukrainian and English interfaces. Signed APK for Obtainium updates."
