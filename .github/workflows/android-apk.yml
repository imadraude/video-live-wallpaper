name: Android APK and Obtainium releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # A release must be explicitly requested: by a matching tag or by a
    # commit whose subject is exactly "release: vX.Y.Z" on main.
    env:
      RELEASE_REQUESTED: "${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v'))) }}"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The upstream action's default includes obsolete SDK 'tools',
          # which sdkmanager no longer provides; install platform-tools only.
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check Ukrainian and English translations
        run: python3 scripts/check_translations.py

      - name: Run tests and assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Attach debug APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: video-wallpaper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Ordinary pushes, PRs and manual workflow runs never publish releases.
      - name: Validate explicit release request and app version
        if: env.RELEASE_REQUESTED == 'true'
        run: |
          VERSION=$(sed -n 's/^appVersionName=//p' gradle.properties)
          if [[ -z "$VERSION" ]]; then
            echo "::error::appVersionName is missing in gradle.properties"
            exit 1
          fi
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            SUBJECT=$(git log -1 --pretty=%s)
            if [[ "$SUBJECT" != "release: $TAG" ]]; then
              echo "::error::Release commit subject must be exactly release: $TAG"
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME must match appVersionName=$VERSION"
              exit 1
            fi
          else
            echo "::error::Release must come from main or a version tag"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify signing secrets are configured
        if: env.RELEASE_REQUESTED == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_SIGNING_PASSWORD" ]]; then
            echo "::error::Both RELEASE_KEYSTORE_BASE64 and RELEASE_SIGNING_PASSWORD must be set as repository Actions secrets."
            exit 1
          fi

      - name: Restore release signing key
        if: env.RELEASE_REQUESTED == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/video-wallpaper-release.p12"
          chmod 600 "$RUNNER_TEMP/video-wallpaper-release.p12"
          echo "CI_SIGNING_KEYSTORE=$RUNNER_TEMP/video-wallpaper-release.p12" >> "$GITHUB_ENV"

      - name: Build release APK with permanent signature
        if: env.RELEASE_REQUESTED == 'true'
        env:
          CI_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signed release APK
        if: env.RELEASE_REQUESTED == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Publish signed APK to GitHub Releases
        if: env.RELEASE_REQUESTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          APK="video-wallpaper-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace published APK"
            exit 1
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "Video Wallpaper $TAG" \
            --notes "## What's new in v1.4.2
          - The full phone-shaped wallpaper preview is visible without scrolling the main screen.
          - Playback speed and technical rendering options now live in a separate settings sheet.
          - File picker, Fill/Fit scaling and Set Wallpaper remain close at hand.
          - Keeps the improved preview loading, error handling and Ukrainian localization.

          Update through Obtainium, or install the signed APK from the assets below."
